{% extends "registration/base_auth.html" %}

{% block title %}{{ SITE_NAME }} - Password updated{% endblock %}

{% block inner_content %}
<div class="login-box card" style="margin: 0 auto;">
    <h2>Password updated</h2>

    <p>Your password has been changed successfully. You can sign in with it now.</p>

    <hr class="hr-sketch">
    <div class="form-footer">
        <a href="{% url 'accounts:login' %}" class="btn btn-primary" style="width: 100%;">Back to login</a>
    </div>
</div>
{% endblock %}
