{% extends "registration/base_auth.html" %}

{% block title %}{{ SITE_NAME }} - Password changed{% endblock %}

{% block inner_content %}
<div class="login-box card" style="margin: 0 auto;">
    <h2>Password changed</h2>

    <p>Your password has been updated. Other devices stay signed in until their
       sessions expire.</p>

    <hr class="hr-sketch">
    <div class="form-footer">
        <a href="{% url 'accounts:profile' %}" class="btn btn-primary" style="width: 100%;">Back to my profile</a>
    </div>
</div>
{% endblock %}
