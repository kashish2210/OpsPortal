{% autoescape off %}
<div style="font-family: 'Patrick Hand', 'Comic Sans MS', cursive, sans-serif; background: #fdfbf7; color: #2b2b2b; padding: 24px;">
  <div style="max-width: 520px; margin: 0 auto; background: #fffcf9; border: 2px solid #1a1a1a; border-radius: 15px 255px 15px 225px/225px 15px 255px 15px; padding: 28px;">
    <h2 style="font-weight: normal; margin: 0 0 16px;">Confirm your e-mail address</h2>

    <p>Hello {{ user.get_username }},</p>
    <p>Welcome to <strong>{{ site_name }}</strong>. Confirm this address to finish setting up your account.</p>

    <p style="text-align: center; margin: 28px 0;">
      <a href="{{ confirm_url }}"
         style="display: inline-block; background: #ffd54f; color: #2b2b2b; border: 2px solid #1a1a1a;
                border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; padding: 12px 28px;
                text-decoration: none; font-weight: bold; box-shadow: 2px 2px 0 #1a1a1a;">
        Confirm my e-mail
      </a>
    </p>

    <p style="font-size: 0.9em; color: #6f6a63;">
      If you did not create this account you can safely ignore this e-mail.
    </p>

    <hr style="border: none; height: 2px; background: #1a1a1a; margin: 24px 0;">
    <p style="font-size: 0.9em; color: #6f6a63;">{{ site_name }}</p>
  </div>
</div>
{% endautoescape %}
