# ---------------------------------------------------------------------------
# Single-origin entry point for the whole stack.
#
#   /            -> the React SPA (history fallback to index.html)
#   /api/        -> Django REST API
#   /accounts/   -> Django-rendered auth pages (login, signup, password reset)
#   /admin/      -> Django admin
#   /static/     -> Django's collected static files (sketch.css, main.js)
#   /media/      -> user uploads
#
# Same-origin means the session cookie set by the Django login page is sent to
# /api/auth/session-token/ as well, which is what makes the SPA handoff work.
# ---------------------------------------------------------------------------

upstream opsportal_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    # gzip the text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;

    # -- SPA ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # -- Django -------------------------------------------------------------
    location /api/     { proxy_pass http://opsportal_backend; include /etc/nginx/conf.d/opsportal_proxy.inc; }
    location /accounts/ { proxy_pass http://opsportal_backend; include /etc/nginx/conf.d/opsportal_proxy.inc; }
    location /admin/   { proxy_pass http://opsportal_backend; include /etc/nginx/conf.d/opsportal_proxy.inc; }
    location /static/  { proxy_pass http://opsportal_backend; include /etc/nginx/conf.d/opsportal_proxy.inc; }

    # Media files are written to a shared Docker volume by the backend and
    # served directly by nginx so uploads keep working when DEBUG=False.
    location /media/ {
        alias /usr/share/nginx/media/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
