# ---------------------------------------------------------------------------
# OpsPortal - Continuous Deployment
#
# Builds multi-arch images and publishes them to the GitHub Container Registry
# (free for public repos, no extra account needed), then optionally pings a
# deploy hook so the host pulls the new tag.
#
# Triggers:
#   * push to main  -> publishes :main and :sha-<commit>
#   * a v* tag      -> publishes :1.2.3, :1.2, :latest
#   * manual run    -> choose the environment
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   RENDER_DEPLOY_HOOK_URL   optional; any provider's redeploy webhook
# GITHUB_TOKEN is provided automatically - no secret needed for GHCR.
# ---------------------------------------------------------------------------

name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### Published \`${{ matrix.service }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Trigger the host redeploy
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Call the deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK_URL secret set - skipping."
            echo "Add one under Settings -> Secrets and variables -> Actions to enable auto-deploy."
            echo "### Deploy skipped (no hook configured)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Triggering the redeploy..."
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK"
          echo "### Deploy triggered :rocket:" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the deployment
        if: ${{ vars.HEALTHCHECK_URL != '' }}
        run: |
          echo "Waiting for the new revision to come up..."
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 10 "${{ vars.HEALTHCHECK_URL }}" | grep -q '"status": *"ok"'; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 10
          done
          echo "The deployment did not become healthy in time."
          exit 1
